<svg xmlns="http://www.w3.org/2000/svg" width="928" height="482" viewBox="0 0 928 482">
<rect width="100%" height="100%" fill="#f6f8fa"/>
<text x="24" y="29" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#1f2328">图 6　CLI 原型 · agy-pool switch 两阶段切号与自动接棒</text>
<rect x="24" y="44" width="880" height="314" rx="8" fill="#1e1c2a" stroke="#30363d" stroke-width="1.2"/>
<text x="40" y="76" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">PS C:\Users\Administrator\Desktop\cspace&gt; </tspan><tspan fill="#d4d4d4" font-weight="bold">agy-pool switch --to backup</tspan></text>
<text x="40" y="102" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#d4d4d4">线程 T1「重构登录鉴权」 · 当前第 1 棒（main） → 目标槽位 </tspan><tspan fill="#2bd9b0" font-weight="bold">backup</tspan></text>
<text x="40" y="154" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">[1/4] 并发冲突检测 .... </tspan><tspan fill="#4ec96a">✓ </tspan><tspan fill="#d4d4d4">无其他运行中的 agy 窗口</tspan></text>
<text x="40" y="180" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">[2/4] 冻结三层交接包 .. </tspan><tspan fill="#4ec96a">✓ </tspan><tspan fill="#d4d4d4">handoffs/T1-seg1.md（2,870 / 3,500 Tokens，已脱敏）</tspan><tspan fill="#ffb020" font-weight="bold"> ①</tspan></text>
<text x="40" y="206" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">[3/4] 引导官方换号 .... </tspan><tspan fill="#f0a440" font-weight="bold">→ 请在弹出的临时会话中完成以下 3 步：</tspan><tspan fill="#ffb020" font-weight="bold"> ②</tspan></text>
<text x="40" y="232" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#d4d4d4">        ① 输入 /logout 退出当前账号</tspan></text>
<text x="40" y="258" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#d4d4d4">        ② 在浏览器登录目标账号 </tspan><tspan fill="#2bd9b0" font-weight="bold">b***@gmail.com (backup)</tspan></text>
<text x="40" y="284" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#d4d4d4">        ③ 登录成功后输入 /exit 返回本终端（Ctrl+C 可随时取消，交接包保留）</tspan></text>
<text x="40" y="310" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">      账号一致性校验 .. </tspan><tspan fill="#4ec96a">✓ </tspan><tspan fill="#d4d4d4">已确认当前登录：b***@gmail.com（匹配 backup）</tspan><tspan fill="#ffb020" font-weight="bold"> ③</tspan></text>
<text x="40" y="336" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">[4/4] 拉起第 2 棒会话 . </tspan><tspan fill="#4ec96a">✓ </tspan><tspan fill="#d4d4d4">agy -i 已启动（PID 22108），HUD 切换为 [T1·backup·#2]</tspan></text>
<circle cx="34" cy="381" r="9" fill="#ffb020"/>
<text x="34" y="385.5" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e1c2a">1</text>
<text x="52" y="386" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#1f2328">Phase 1 先将 L1/L2/L3 交接包原子落盘并展示 Token 预算占用（FR-07、FR-08）</text>
<circle cx="34" cy="407" r="9" fill="#ffb020"/>
<text x="34" y="411.5" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e1c2a">2</text>
<text x="52" y="412" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#1f2328">Phase 2 弹出临时非托管会话由用户执行官方 /logout + OAuth，期间释放文件锁且零接触凭据</text>
<circle cx="34" cy="433" r="9" fill="#ffb020"/>
<text x="34" y="437.5" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e1c2a">3</text>
<text x="52" y="438" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#1f2328">Phase 3 比对邮箱哈希确认登对账号后，自动注入环境变量并以 agy -i 喂入交接包启动词（FR-10）</text>
</svg>