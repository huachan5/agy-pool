<svg xmlns="http://www.w3.org/2000/svg" width="928" height="508" viewBox="0 0 928 508">
<rect width="100%" height="100%" fill="#f6f8fa"/>
<text x="24" y="29" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#1f2328">图 5　CLI 原型 · agy-pool switch 多窗口并发冲突拦截</text>
<rect x="24" y="44" width="880" height="340" rx="8" fill="#1e1c2a" stroke="#30363d" stroke-width="1.2"/>
<text x="40" y="76" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">PS C:\Users\Administrator\Desktop\cspace&gt; </tspan><tspan fill="#d4d4d4" font-weight="bold">agy-pool switch --to backup</tspan></text>
<text x="40" y="102" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#d4d4d4">线程 T1「重构登录鉴权」 · 当前第 1 棒（main） → 目标槽位 </tspan><tspan fill="#2bd9b0" font-weight="bold">backup</tspan></text>
<text x="40" y="154" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#f44747" font-weight="bold">✗ 检测到 2 个仍在运行的 agy 窗口，单机登录态下换号会导致它们掉线：</tspan><tspan fill="#ffb020" font-weight="bold"> ①</tspan></text>
<text x="40" y="206" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">  PID       类型      线程/棒次       账号      启动时间</tspan></text>
<text x="40" y="232" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#d4d4d4">  18240     托管      T2 · #1         main      10:42</tspan></text>
<text x="40" y="258" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#d4d4d4">  20516     </tspan><tspan fill="#f0a440" font-weight="bold">非托管</tspan><tspan fill="#ffb020" font-weight="bold"> ②</tspan><tspan fill="#d4d4d4">    —               ?         11:05</tspan></text>
<text x="40" y="310" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#d4d4d4">下一步：请先在上述窗口执行 /exit 退出，再重新运行本命令。</tspan></text>
<text x="40" y="336" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#8b949e">若确认可中断它们：</tspan><tspan fill="#e5c07b">agy-pool switch --to backup --force</tspan><tspan fill="#ffb020" font-weight="bold"> ③</tspan><tspan fill="#8b949e">（需输入 yes 二次确认）</tspan></text>
<text x="40" y="362" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', 'PingFang SC', monospace" font-size="14" xml:space="preserve"><tspan fill="#4b5263">（退出码 3）</tspan></text>
<circle cx="34" cy="407" r="9" fill="#ffb020"/>
<text x="34" y="411.5" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e1c2a">1</text>
<text x="52" y="412" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#1f2328">换号前扫描全部存活 agy.exe 进程，默认拦截并列出冲突清单（FR-09）</text>
<circle cx="34" cy="433" r="9" fill="#ffb020"/>
<text x="34" y="437.5" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e1c2a">2</text>
<text x="52" y="438" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#1f2328">未经 agy-pool 启动的原生非托管窗口同样会被识别并标橙提醒</text>
<circle cx="34" cy="459" r="9" fill="#ffb020"/>
<text x="34" y="463.5" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1e1c2a">3</text>
<text x="52" y="464" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="13.5" fill="#1f2328">提供明确的可执行恢复指引；源会话自身未退出时不可通过 --force 跳过</text>
</svg>